<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        <title>Central da bola</title>
        <style>
            header{
                background-color: #183C63;
                color:#fdfffc;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                background-color: #183C63;
                padding: 16px;
            }
            main {
                background-color: #fdfffc;
                color: #183C63
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img{
                width: 500px;
                height: 500px;
            }
             .artigo-autor {
                font-weight: bold;
            }
        </style>
    </head>
         <body>
            <header>
                <h1>Central da Bola</h1>
                <p>vou compartilhar tudo sobre futebol e o que esta acontecendo</p>
             </header>
             <main>
                <img src="bola.png" alt="Um ícone minimalista e estilizado de uma bola de futebol girando com linhas de movimento.">
                <div>

                    <h2>Meu primeiro post</h2>
                    <p class="artigo-autor">Por: Kaua Machry</p>
                    <p>Boas-vindas ao meu portal de noticias!Aqui eu vou
                        compartilhar tudo o que acontece e o que esta acontecendo no mundo do futebol.</p>
                        <button>❤️​ <span>0</span></button>
                        <button>👍​​ <span>0</span></button>
                </div>

              </main>
        </body>
        <script>
            const botao = document.querySelector("button");
            botao.addEventListener("click", botaoClicado);
            
            function botaoClicado(){
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                texto.textContent++;
            }

        </script>
</html>
